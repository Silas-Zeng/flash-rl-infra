[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-rl-infra"
version = "0.2.0"
description = "A reproducible RL data plane and reference compression lab for speculative-decoding workloads"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27"]
torch = ["torch>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
flashrl = "flashrl.cli:main"
flashrl-distributed = "flashrl.distributed_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
